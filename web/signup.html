<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account — ZOROX.AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 font-family:Inter,system-ui,sans-serif;color:#fff;background:#03050b;
 background-image:radial-gradient(circle at 50% 35%,rgba(255,45,85,.12),transparent 35%);
}
.card{
 width:min(420px,92%);padding:38px;border-radius:24px;
 background:rgba(10,15,28,.82);border:1px solid rgba(100,150,255,.2);
 box-shadow:0 25px 80px rgba(0,0,0,.5);backdrop-filter:blur(20px);
}
.logo{font-size:30px;font-weight:800;margin-bottom:8px}
.logo span{color:#639dff}
.sub{color:#8997b2;margin-bottom:28px}
input{
 width:100%;padding:14px;margin:7px 0;border-radius:11px;
 border:1px solid rgba(120,150,210,.2);background:#080d18;color:#fff;
 outline:none;
}
button{
 width:100%;padding:14px;margin-top:15px;border:0;border-radius:11px;
 color:#fff;font-weight:700;cursor:pointer;
 background:linear-gradient(135deg,#287dff,#684cff);
}
.msg{margin-top:15px;text-align:center;color:#9fb5d8;font-size:13px}
a{color:#69a9ff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
 <div class="logo">ZOROX<span>.AI</span></div>
 <div class="sub">Create your ZOROX.AI account.</div>

 <input id="username" placeholder="Username">
 <input id="email" type="email" placeholder="Email">
 <input id="password" type="password" placeholder="Password">
 <input id="country" placeholder="Country" value="Sri Lanka">
 <button onclick="signup()">Create Account</button>

 <div class="msg" id="msg"></div>
 <div class="msg">Already have an account? <a href="login.html">Login</a></div>
 <div class="msg"><a href="index.html">← Back to ZOROX.AI</a></div>
</div>

<script>
async function signup(){
 const username=document.getElementById("username").value.trim();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const country=document.getElementById("country").value.trim()||"Sri Lanka";
 const msg=document.getElementById("msg");

 if(!username||!email||!password){
  msg.textContent="Please fill all required fields.";return
 }

 try{
  const r=await fetch("http://"+location.hostname+":5000/api/register",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username,email,password,country})
  });
  const data=await r.json();
  msg.textContent=data.message || "Account created.";
  if(r.ok){ msg.textContent="Account created successfully! Redirecting to Login..."; setTimeout(()=>{ window.location.replace("login.html"); },1500); }
 }catch(e){msg.textContent="Server connection error."}
}
</script>
</body>
</html>
